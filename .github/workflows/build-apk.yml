name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_RAW_VERSION"

          # Extract major version
          MAJOR_VERSION=$(echo "$JAVA_RAW_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ]; then
            echo "ERROR: Unable to detect Java major version." >&2
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Found Java $MAJOR_VERSION." >&2
            exit 1
          fi
          echo "Java version check passed: Java $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore was not created." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            echo "Verified expected APK exists: $EXPECTED_APK"
          else
            echo "ERROR: Expected APK missing at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" >&2
            fi
            exit 1
          fi

          # Confirm regular file, non-empty, .apk extension
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file $EXPECTED_APK is empty." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) echo "APK extension verified." ;;
            *) echo "ERROR: File does not have .apk extension." >&2; exit 1 ;;
          esac

          echo "APK verification successful."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ]; then
            echo "ERROR: Source APK not found at $SOURCE_APK" >&2
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Sanitize repo name: allow only alphanumeric and hyphens
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_APK="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "$SOURCE_APK" "$TARGET_APK"

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Failed to copy or verify release asset at $TARGET_APK" >&2
            exit 1
          fi

          echo "Release asset prepared: $TARGET_APK"
          echo "asset_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty." >&2
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** \`${{ github.sha }}\`

          > **Note:** This APK is intended strictly for testing and development diagnostics. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$TAG" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset File: $ASSET_NAME"

            {
              echo "### :rocket: Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **Download APK:** [$ASSET_NAME]($RELEASE_URL)"
              echo "- **Release Page:** [View Release]($RELEASE_URL)"
              echo ""
              echo "The debug APK can be downloaded directly onto your Android device from the **Assets** section of the release page above."
              echo ""
              echo "> **Backup:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in the run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=== Warning: GitHub Release Publishing Failed or Skipped ==="
            echo "WARNING: Release publishing encountered an issue or lacked permissions."
            echo "The debug APK build completed successfully."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "### :warning: Debug APK Build Succeeded (Release Notice)"
              echo ""
              echo "- The debug APK built successfully."
              echo "- GitHub Release publishing was not completed."
              echo "- **Download Backup Artifact:** The GitHub Actions artifact named \`app-debug-apk\` is available for download on this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
